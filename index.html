<title>カンペ先生 ドバイ編</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 構図: 夜の空港の暗い窓(カンペ先生グアム編と同じ作り)。場所マップ → 場所の絵+黒い会話窓 → 大きなカンペ → 単語3択 → 日本語で答え合わせ。1つの見た目に決め打ち(単一テーマ) */
:root{--bg:#0d1226;--win:#05070f;--line:#f4f1e8;--ink:#10131f;--paper:#fff6d8;--gold:#ffc72c;--hot:#ff5a3c;--ok:#34d27b;--mute:#9aa6c4;--strong:#d6362a;--navy:#27325a;--brown:#2a1a10;--info:#6cc0f5;--bad:#ff8a7a;color-scheme:dark}

html,body{height:100%}
body{margin:0;box-sizing:border-box;background:var(--bg);color:var(--line);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
#app.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* ---- マップ ---- */
#mapView{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.mapbar h1{margin:0;font-size:16px;font-weight:800;line-height:1.25;text-wrap:balance}
.mapbar h1 small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.badge{flex:none;font-size:11px;font-weight:800;color:var(--bg);background:var(--gold);border-radius:6px;padding:2px 8px}
#pips{display:flex;gap:4px;flex-wrap:wrap;flex:none}
#pips i{width:12px;height:12px;border:2px solid var(--line);border-radius:3px;background:var(--win)}

#map{position:relative;flex:1;min-height:0;border:3px solid var(--line);border-radius:6px;overflow:hidden;background-color:#efe6d2;box-shadow:0 0 0 2px var(--win),0 0 0 4px #5b6690}

.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;padding:0;font:inherit;background:var(--paper);border:3px solid var(--brown);border-radius:6px;box-shadow:0 5px 0 var(--brown);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.node .ico{font-size:34px;line-height:1}

.node .nm{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:800;color:var(--ink);background:rgba(255,246,216,.92);border:2px solid var(--brown);border-radius:6px;padding:0 6px}
.node .star{position:absolute;top:-11px;right:-9px;font-size:20px;color:var(--gold);text-shadow:0 2px 0 var(--brown);display:none}
.node.done .star{display:block}
.node .dots{position:absolute;bottom:-14px;left:0;right:0;display:flex;gap:4px;justify-content:center}
.node .dots i{width:9px;height:9px;border-radius:2px;border:2px solid var(--brown);background:#fff6d8}
.node .dots i.on{background:var(--gold)}
.walker{position:absolute;z-index:4;pointer-events:none;transition:left .75s ease-in-out,top .75s ease-in-out}
#hero{transform:translate(-50%,16px)}
#buddy{transform:translate(-135%,26px);transition-duration:.95s}
#hero canvas,#buddy canvas{display:block;image-rendering:pixelated}
.foot{margin:0;font-size:11px;line-height:1.6;color:var(--mute);flex:none}
/* ---- 場面 ---- */
#sceneView{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.stage{position:relative;flex:none}
#scene{display:block;width:100%;aspect-ratio:320/150;image-rendering:pixelated;border:3px solid var(--line);border-radius:6px;background:#222}

#tip{position:absolute;left:6px;top:6px;max-width:72%;background:rgba(5,7,15,.85);border:2px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;line-height:1.35;pointer-events:none}
#tip small{display:block;font-weight:500;color:var(--gold);font-size:11px}
.win{flex:none;position:relative;background:var(--win);border:3px solid var(--line);border-radius:6px;padding:12px 14px 10px;min-height:76px;box-shadow:0 0 0 2px var(--win),0 0 0 4px #5b6690}
.win .who{position:absolute;top:-12px;left:12px;background:var(--win);border:2px solid var(--line);border-radius:4px;padding:0 8px;font-size:12px;font-weight:800;letter-spacing:.04em;max-width:calc(100% - 140px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .who:empty{display:none}
.win .tag{position:absolute;top:-12px;right:12px;border-radius:4px;padding:0 8px;font-size:12px;font-weight:800;border:2px solid var(--line);background:var(--win)}

.cue .w.s{font-size:46px;line-height:1.15;font-weight:900;color:var(--strong)}
.cue .w.on{transform:scale(1.15);color:#0a7c4a}
.cue .lab{position:absolute;top:5px;right:10px;font-size:11px;color:#8a7b55;font-weight:800;letter-spacing:.06em}
.row{display:flex;gap:8px;flex:none}
.btn{font:inherit;font-weight:800;color:#fff;background:var(--hot);border:3px solid var(--brown);border-radius:14px;padding:12px;box-shadow:0 5px 0 var(--brown);cursor:pointer;min-height:56px;font-size:20px;flex:1;touch-action:none}
.btn:active,.btn.down{transform:translateY(3px);box-shadow:0 2px 0 var(--brown)}
.btn.sub{background:var(--navy);font-size:14px;flex:none;padding:8px 14px;min-height:44px}
.btn.go{font-size:clamp(56px,20vw,96px);letter-spacing:.06em;text-shadow:0 4px 0 var(--brown)}
.btn.go.shake{animation:goShake .55s linear infinite}
@keyframes goShake{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-3px,1px) rotate(-1.2deg)}20%{transform:translate(3px,-1px) rotate(1.2deg)}30%{transform:translate(-3px,-1px) rotate(-1deg)}40%{transform:translate(3px,1px) rotate(1deg)}50%{transform:translate(-2px,2px) rotate(-1.2deg)}60%{transform:translate(2px,-2px) rotate(1.2deg)}70%{transform:translate(-3px,0) rotate(-1deg)}80%{transform:translate(3px,1px) rotate(1deg)}90%{transform:translate(-2px,-1px) rotate(-.8deg)}}

.btn[disabled]{opacity:.45}
.stat{min-height:20px;font-size:13px;font-weight:800;color:var(--mute);text-align:center;flex:none}
.stat.ok{color:var(--ok)}.stat.ng{color:var(--bad)}
.choices{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.ch{font:inherit;font-weight:800;font-size:24px;color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:12px;padding:8px;box-shadow:0 4px 0 var(--brown);cursor:pointer;flex:1;min-height:52px}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
.ch.good{background:#baf5d0}.ch.bad{background:#ffb9ae}
.prompt{position:relative;background:var(--win);border:3px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;flex:none}
.prompt .en{font-size:44px;font-weight:800;line-height:1.1;color:#fff;text-wrap:balance;overflow-wrap:anywhere}
.prompt .ipa{font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;font-size:21px;font-weight:500;color:var(--gold)}
.prompt .combo{position:absolute;top:6px;right:10px;font-size:20px;font-weight:800;color:var(--hot)}
.dots{display:flex;gap:5px;flex:none}
.dots i{flex:1;height:8px;border-radius:4px;background:#1a2142}
.dots i.on{background:var(--ok)}
.bar{height:10px;background:#1a2142;border-radius:5px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:100%;background:var(--gold)}
.reveal{background:var(--win);border:3px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.reveal .en{font-size:22px;color:#fff;font-weight:800;line-height:1.35;text-wrap:balance}
.reveal .jp{font-size:16px;color:var(--gold);font-weight:800;line-height:1.5}
.reveal .who2{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.08em}
.note{margin:0;font-size:11px;font-weight:500;color:var(--mute);line-height:1.5;flex:none}
/* 発音チェック: 聞こえた文字・赤表示 */
.cue{padding-bottom:78px}
.cue .heard{position:absolute;left:12px;right:12px;bottom:8px;font-size:24px;font-weight:800;line-height:1.3;color:#5a5340;max-height:66px;overflow:hidden}
.cue .heard::before{content:'🎤';font-size:1.45em;line-height:1;margin-right:.25em;vertical-align:-.12em}
.cue .heard.nomic::before{content:none}
.cue .heard.live{color:#8a7b55}
.cue .heard b{color:#e11d2e}
.cue.ev .w,.cue.ev .w.s{color:#0a7c4a}
.cue.ev .w.bad,.cue.ev .w.s.bad{color:#e11d2e;text-decoration:underline wavy #e11d2e;text-underline-offset:5px}
.cue.ev .w em{font-style:normal;color:#e11d2e;text-decoration:underline wavy #e11d2e;text-underline-offset:5px}
/* 羽田 発音教室 */
.boothbtn{flex:none;font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:12px;padding:10px;box-shadow:0 4px 0 var(--brown);cursor:pointer}
.boothbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
#boothView{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#boothBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.tabs{display:flex;gap:8px;flex:none}
.tab{flex:1;font:inherit;font-weight:800;font-size:14px;color:var(--line);background:#161d3a;border:2px solid #2c3a6e;border-radius:10px;padding:8px}
.tab.on{background:var(--navy);border-color:var(--gold)}
.blist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.brow{font:inherit;text-align:left;color:var(--line);background:#161d3a;border:2px solid #2c3a6e;border-radius:10px;padding:8px 10px;cursor:pointer}
.btop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bw{font-size:20px;font-weight:800;word-break:break-word}
.bn{font-size:12px;color:var(--mute);flex:none}
.bsub{font-size:13px;color:var(--mute);margin-top:2px}
.chip{color:#ff6b78;font-weight:800}
.bp{color:var(--ok);font-weight:800}
.bempty{color:var(--mute);font-size:13px;line-height:1.6;margin:8px 4px}
.atts{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.att{display:flex;gap:8px;align-items:center;background:#161d3a;border:2px solid #2c3a6e;border-radius:8px;padding:6px 8px;font-size:14px;font-weight:800}
.att.good{border-color:var(--ok);background:#12301f}
.att .an{color:var(--mute);flex:none}
.att .ah{flex:1;min-width:0;word-break:break-word}
.att .ah b{color:#ff6b78}
.bd{flex:none;font-size:12px}.bd.ok{color:var(--ok)}.bd.mid{color:#ffc72c}.bd.ng{color:#ff6b78}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-height:700px){.cue .w.s{font-size:34px}.cue .w{font-size:21px}.win p{font-size:19px;min-height:56px}.win{min-height:64px}.prompt .en{font-size:38px}.prompt{min-height:84px}}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}
</style>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif';
var W=1800,VW=320,VH=150,PX=3,GY=122;
var cv=$('scene'),c=cv.getContext('2d');
c.imageSmoothingEnabled=false;
/* ---------- 音(すべてブラウザの中で合成。音声ファイルなし・外部通信なし) ---------- */
var Snd=(function(){
 var AC=null,master,send,dly,fb,noiseBuf,kg=null,tm=null,nodes=[],step=0,next=0,want=null,cur=null,on=true,duckT=0,ngt=false;
 try{on=localStorage.getItem('kd_snd')!=='off'}catch(e){}
 function hz(m){return 440*Math.pow(2,(m-69)/12)}
 var H=[62,63,66,67,69,70,72,74];            /* ヒジャーズ旋法(D E♭ F♯ G A B♭ C D)。E♭→F♯の広い音程がアラビアらしい響き */
 function init(){
  if(AC){try{AC.resume()}catch(e){}return true}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
   master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);
   send=AC.createGain();send.gain.value=.16;dly=AC.createDelay(1);dly.delayTime.value=.34;fb=AC.createGain();fb.gain.value=.38;
   send.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(master);
   noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   return true}catch(e){AC=null;return false}}
 function tone(f,t,d,type,v,att){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(kg);o.start(t);o.stop(t+d+.05)}
 function pluck(f,t,d,v){tone(f,t,d,'triangle',v);tone(f*2,t,d*.5,'sine',v*.35);tone(f*3.01,t,.07,'square',v*.07)}
 function pad(f,t,d,v){tone(f,t,d,'triangle',v,Math.min(.7,d/3));tone(f*2,t,d,'sine',v*.3,Math.min(.9,d/3))}
 function noise(t,d,v,freq,type,q){var s=AC.createBufferSource();s.buffer=noiseBuf;var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;if(q)f.Q.value=q;
  var g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(kg);s.start(t);s.stop(t+d+.02)}
 function loopNoise(freq,q,gain,lfoHz,lfoDepth,type){var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  var g=AC.createGain();g.gain.value=gain;
  if(lfoHz){var l=AC.createOscillator();l.frequency.value=lfoHz;var lg=AC.createGain();lg.gain.value=lfoDepth;l.connect(lg);lg.connect(g.gain);l.start();nodes.push(l)}
  s.connect(f);f.connect(g);g.connect(kg);s.start();nodes.push(s)}
 function whoosh(t,d,v,f0,f1){var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;var f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(f0,t);f.frequency.linearRampToValueAtTime(f1,t+d/2);f.frequency.linearRampToValueAtTime(f0,t+d);
  var g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d/2);g.gain.linearRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(kg);s.start(t);s.stop(t+d+.05)}
 function dum(t,v){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(58,t+.13);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(kg);o.start(t);o.stop(t+.25)}
 function tak(t,v){noise(t,.05,v,2600,'bandpass',1.2)}
 function chime(t,v){[659.25,523.25,783.99].forEach(function(f,i){tone(f,t+i*.42,1.1,'sine',v)})}      /* 搭乗案内の前のチャイム(自作の3音) */
 function clink(t){tone(3200,t,.12,'sine',.03);tone(4100,t+.05,.1,'sine',.025)}
 function ding(t){tone(988,t,.5,'sine',.05);tone(784,t+.28,.7,'sine',.05)}                       /* 駅の案内の「ピンポーン」 */
 function train(t){var i,tt=t;tone(880,t,.2,'sine',.05);tone(1175,t+.22,.3,'sine',.05);               /* 電車: 入る合図 → レールの音(だんだん速く) → ブレーキ → ドアの合図 */
  tt=t+.9;for(i=0;i<16;i++){noise(tt,.045,.09,1500,'bandpass',2);tt+=Math.max(.07,.22-i*.01)}
  noise(tt,1.3,.05,6000,'highpass');for(i=0;i<3;i++)tone(1500,tt+1.6+i*.2,.1,'square',.03)}
 function jet(t,d){var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';              /* 窓の外を飛行機が通る */
  o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(320,t+d*.55);o.frequency.linearRampToValueAtTime(140,t+d);

  {y:"*Good* *idea*. *Is* it *quiet* *there*?",jp:"いい考えですね。そこは静かですか。"},
  {n:"Some places are quiet. Enjoy your trip, my friend.",jp:"静かな場所もありますよ。よい旅を、友よ。"},
  {y:"*Thank* you. *Have* a *wonderful* *day*!",jp:"ありがとう。すてきな一日を。"}],
  words:[["welcome","/ˈwɛlkəm/","ようこそ"],["first time","/fɜːrst taɪm/","初めて"],["wait","/weɪt/","待ち時間・待つ"],["quiet","/ˈkwaɪət/","静かな"],["enjoy","/ɪnˈdʒɔɪ/","楽しむ"]]},
 greet2:{who:'旅行者',lines:[
  {n:"Hey! Nice scarf on your green friend.",jp:"やあ！緑の友だち、すてきなスカーフだね。"},
  {y:"*Thanks*! *Her* *name* is *Lulu*.",jp:"ありがとう。名前はルルです。"},
  {n:"Lulu! Cool name. Is she traveling with you?",jp:"ルル！いい名前。いっしょに旅行してるの？"},
  {y:"*Yes*. *We* *travel* *together* *everywhere*.",jp:"はい。どこへでもいっしょに旅します。"},
  {n:"That's awesome. I'm going home after a long trip. I'm so tired.",jp:"すてきだね。長い旅のあとで帰るところ。とても疲れたよ。"},
  {y:"*Oh*. *Where* *were* you?",jp:"ああ。どこにいたんですか。"},
  {n:"I was in Asia for two weeks. Great food, but too many flights.",jp:"アジアに2週間いたよ。食べ物は最高だったけど、フライトが多すぎた。"},
  {y:"*Two* *weeks*! *What* was your *favorite* *food*?",jp:"2週間も。いちばん好きな食べ物は何でしたか。"},
  {n:"Noodles! I ate noodles every day. Have a great flight!",jp:"麺！毎日食べたよ。よいフライトを。"},
  {y:"*Sounds* *good*. *You* *too*, *see* *you*!",jp:"おいしそう。あなたも。またね。"}],
  words:[["scarf","/skɑːrf/","スカーフ"],["travel","/ˈtrævəl/","旅行する"],["tired","/ˈtaɪərd/","疲れた"],["favorite","/ˈfeɪvərɪt/","いちばん好きな"],["noodles","/ˈnuːdəlz/","麺"]]},
 veranda_good:{who:'Veranda Cafe & Patisserie',lines:[
  {n:"Hi! This is my favorite café in Terminal 3. I dropped my sandwich, and they made a new one right away!",jp:"こんにちは！ここはターミナル3で一番好きなカフェ。サンドイッチを落としたら、すぐ作り直してくれたの。"},
  {y:"*Wow*, that's *kind*! Is the *coffee* *good*?",jp:"わあ、親切ですね。コーヒーはおいしいですか。"},
  {n:"Yes, the best coffee I've had in weeks. But it's expensive. A cappuccino was about ten dollars.",jp:"うん、ここ数週間で一番のコーヒー。でも高いの。カプチーノが約10ドル。"},
  {y:"*Ten* *dollars*? *Well*, I'll *try* *one*.",jp:"10ドル？まあ、1杯飲んでみます。"},
  {n:"Good idea. Try the pastries too. The croissant is warm and fresh.",jp:"いいね。ペストリーも食べてみて。クロワッサンは温かくて作りたてよ。"},
  {y:"*Which* *one* do you *like* *best*?",jp:"どれがいちばん好きですか。"},
  {n:"I like the almond one. It's sweet, but not too sweet.",jp:"私はアーモンドのが好き。甘いけど、甘すぎないの。"},
  {y:"*Sounds* *delicious*. *Can* I *sit* *here*?",jp:"おいしそう。ここに座っていいですか。"},
  {n:"Of course. Take your time. The seats are comfortable.",jp:"もちろん。ゆっくりどうぞ。席は座り心地がいいわよ。"},
  {y:"*Thank* you! *I'll* *order* *now*.",jp:"ありがとう。いま注文します。"}],
  words:[["dropped","/drɑːpt/","落とした"],["right away","/raɪt əˈweɪ/","すぐに"],["expensive","/ɪkˈspɛnsɪv/","高い"],["cappuccino","/ˌkæpəˈtʃiːnoʊ/","カプチーノ"],["pastry","/ˈpeɪstri/","ペストリー"],["comfortable","/ˈkʌmftərbəl/","座り心地のよい"]]},
 veranda_bad:{who:'Veranda Cafe & Patisserie',lines:[
  {n:"We ordered two cappuccinos here, but the coffee was too weak. Then one more cup cost twenty-one dirhams!",jp:"ここでカプチーノを2つ頼んだけど、味が薄すぎた。その上、もう1杯が21ディルハムもしたんだ。"},
  {y:"*Twenty-one*? That's *a* *lot*. *Did* they *ask* if you *like* it *strong*?",jp:"21ディルハム？高いですね。濃いのが好きか聞いてくれましたか。"},
  {n:"No, they didn't. I was disappointed.",jp:"いいや、聞かれなかった。がっかりしたよ。"},
  {y:"*I'm* *sorry*. *Did* you *tell* the *staff*?",jp:"それは残念。店員さんに言いましたか。"},
  {n:"Yes, but they just said sorry. I didn't want to wait again.",jp:"言ったけど、謝られただけ。もう一度待ちたくなかったんだ。"},
  {y:"*That's* *too* *bad*. *Was* the *place* *busy*?",jp:"それはひどいですね。店は混んでいましたか。"},
  {n:"Not really. Maybe it was just a bad day.",jp:"それほどでも。たまたま悪い日だったのかも。"},
  {y:"*Maybe*. *I'll* *try* it *anyway*.",jp:"かもしれませんね。とにかく試してみます。"},
  {n:"Good luck. Ask for a strong one!",jp:"がんばって。濃いのを頼んでね！"},
  {y:"*Thanks* for the *tip*. *I'll* *ask*.",jp:"教えてくれてありがとう。頼んでみます。"}],
  words:[["weak","/wiːk/","薄い"],["strong","/strɔːŋ/","濃い"],["disappointed","/ˌdɪsəˈpɔɪntɪd/","がっかりした"],["busy","/ˈbɪzi/","混んでいる"],["anyway","/ˈɛniweɪ/","とにかく"],["tip","/tɪp/","ヒント・助言"]]},
 s34_good:{who:'S34',lines:[
  {n:"S34 is open twenty-four hours. It's quiet, so I can work here.",jp:"S34は24時間営業。静かだから、ここで仕事ができるの。"},
  {y:"*Nice*! What did you *eat*?",jp:"いいですね。何を食べたの？"},
  {n:"Cheese flatbread, fresh and hot. And a strong Kadak chai. Perfect!",jp:"チーズのフラットブレッドで、焼きたて。それと濃いカダックチャイ。最高！"},
  {y:"*That* *sounds* *perfect*. *Is* it a *big* *portion*?",jp:"最高ですね。量は多いですか。"},
  {n:"The size is good. One is enough for lunch.",jp:"ちょうどいい量。1つでお昼に足りるよ。"},
  {y:"*Good*. *Can* I *use* my *laptop* *there*?",jp:"いいですね。そこでパソコンを使えますか。"},
  {n:"Yes, there are plugs near the tables. I charged my phone there.",jp:"うん、テーブルの近くにコンセントがあるよ。そこで携帯を充電した。"},
  {y:"*Great*. *I* *need* to *charge* *mine*.",jp:"よかった。私も充電が必要なんです。"},
  {n:"Sit by the wall. It's the quietest spot.",jp:"壁ぎわに座って。いちばん静かな場所だよ。"},
  {y:"*Thanks*! *I'll* *go* *now*.",jp:"ありがとう。いま行きます。"}],
  words:[["twenty-four hours","/ˌtwɛnti fɔːr ˈaʊərz/","24時間"],["fresh","/frɛʃ/","できたての"],["flatbread","/ˈflætbrɛd/","フラットブレッド"],["portion","/ˈpɔːrʃən/","1人前の量"],["charge","/tʃɑːrdʒ/","充電する"],["plug","/plʌɡ/","コンセント"]]},
 s34_bad:{who:'S34',lines:[
  {n:"The food was just okay. The menu is small.",jp:"料理はまあまあ。メニューが少ないんだ。"},
  {y:"*Really*? Is it *like* a *restaurant*?",jp:"そうなんですか。レストランみたいですか。"},
  {n:"Not really. It's more like a café. The service is fast, though.",jp:"いや、どちらかというとカフェだね。でも、提供は速いよ。"},
  {y:"*Fast* is *good*. *What* did you *order*?",jp:"速いのはいいですね。何を頼みましたか。"},
  {n:"A sandwich. It was cold in the middle.",jp:"サンドイッチ。真ん中が冷たかったんだ。"},
  {y:"*Oh* *no*. *Did* you *ask* for a *hot* *one*?",jp:"それは困りましたね。温かいのを頼みましたか。"},
  {n:"I did. They changed it quickly. So I can't complain.",jp:"頼んだよ。すぐ替えてくれた。だから文句は言えないな。"},
  {y:"*That's* *nice*. *Was* the *tea* *good*?",jp:"それはいいですね。紅茶はおいしかったですか。"},
  {n:"The tea was good. I'd go back for tea.",jp:"紅茶はおいしかった。紅茶のためならまた行くよ。"},
  {y:"*Okay*. *I'll* *try* the *tea*.",jp:"わかりました。紅茶を試します。"}],
  words:[["menu","/ˈmɛnjuː/","メニュー"],["service","/ˈsɜːrvɪs/","接客・サービス"],["though","/ðoʊ/","でも"],["cold","/koʊld/","冷たい"],["complain","/kəmˈpleɪn/","文句を言う"]]},
 costa_good:{who:'Costa Coffee',lines:[
  {n:"I love this little coffee corner. It's quiet, and the staff are fast.",jp:"この小さなコーヒーコーナーが好き。静かだし、店員さんも速いの。"},
  {y:"*Do* they have *food*?",jp:"食べ物もありますか。"},
  {n:"Yes! Salads, hot paninis, and cakes. There are even a couple of sofas.",jp:"あるよ！サラダ、温かいパニーニ、ケーキ。ソファも2つあるんだ。"},
  {y:"*Sofas*! *Can* I *rest* *here*?",jp:"ソファ！ここで休めますか。"},
  {n:"Sure. It's near the Lego store. Kids love looking at it.",jp:"もちろん。レゴの店の近くだよ。子どもたちが見るのが大好きなんだ。"},
  {y:"*Nice*. *My* *legs* are *tired*.",jp:"いいですね。足が疲れました。"},
  {n:"Then sit for a while. I read a book here for an hour.",jp:"じゃあ少し座って。私はここで1時間、本を読んだよ。"},
  {y:"*An* *hour*! *That's* *long*.",jp:"1時間も。長いですね。"},
  {n:"I had time before my flight. Enjoy your coffee!",jp:"フライトの前に時間があったからね。コーヒーを楽しんで！"},
  {y:"*Thank* you. *Good* *luck*!",jp:"ありがとう。がんばって。"}],
  words:[["salad","/ˈsæləd/","サラダ"],["a couple of","/ə ˈkʌpəl əv/","2つほどの"],["sofa","/ˈsoʊfə/","ソファ"],["rest","/rɛst/","休む"],["for a while","/fər ə waɪl/","しばらく"]]},
 costa_bad:{who:'Costa Coffee',lines:[
  {n:"The tables were dirty, and they brought me the wrong order.",jp:"テーブルが汚くて、注文も間違えられた。"},
  {y:"*Oh* *no*. What did you *order*?",jp:"それは困りましたね。何を頼んだんですか。"},
  {n:"A small coffee. I got a large one.",jp:"小さいコーヒーを頼んだのに、大きいのが来たんだ。"},
  {y:"*Did* you *tell* *them*?",jp:"お店の人に言いましたか。"},
  {n:"Yes. They said sorry, but they didn't change it.",jp:"言ったよ。謝られたけど、替えてくれなかった。"},
  {y:"*That's* *not* *good*. *Did* you *drink* it?",jp:"それはよくないですね。飲みましたか。"},
  {n:"A little. Then I threw it away. It was too sweet.",jp:"少しだけ。それから捨てた。甘すぎたんだ。"},
  {y:"*I'm* *sorry*. *Where* *should* I *go* *instead*?",jp:"お気の毒に。かわりにどこへ行けばいいですか。"},
  {n:"Try the café down the hall. It looked cleaner.",jp:"通路の先のカフェを試してみて。もっと清潔そうだったよ。"},
  {y:"*Thanks*. *I'll* *check* it *out*.",jp:"ありがとう。見てみます。"}],
  words:[["dirty","/ˈdɜːrti/","汚い"],["wrong","/rɔːŋ/","間違った"],["order","/ˈɔːrdər/","注文"],["throw away","/θroʊ əˈweɪ/","捨てる"],["instead","/ɪnˈstɛd/","かわりに"],["hall","/hɔːl/","通路・広間"]]},
 costa_bad2:{who:'Costa Coffee',lines:[
  {n:"I used my airline's food voucher during a seven-hour layover. The cashier was rude to me.",jp:"7時間の乗り継ぎ中に、航空会社の食事クーポンを使ったら、レジの人に失礼な態度をされたよ。"},
  {y:"*Seven* *hours*? That's *long*.",jp:"7時間？長いですね。"},
  {n:"Yes. I was tired and hungry. And the cashier looked angry.",jp:"うん。疲れておなかもすいていた。しかもレジの人は怒っているように見えた。"},
  {y:"*That's* *terrible*. What *happened*?",jp:"それはひどい。何があったんですか。"},
  {n:"I showed the voucher. He sighed and said it was too much trouble.",jp:"クーポンを見せたら、ため息をついて、面倒だと言われたんだ。"},
  {y:"*That's* *not* *polite*. *Did* you *get* *food*?",jp:"礼儀正しくないですね。食べ物は買えましたか。"},
  {n:"Yes, in the end. A sandwich and water. But I felt bad.",jp:"うん、結局ね。サンドイッチと水。でも嫌な気分だった。"},
  {y:"*I'm* *sorry*. *Please* *sit* and *rest*.",jp:"お気の毒に。座って休んでください。"},
  {n:"Thank you. Maybe a smile is the best way to start.",jp:"ありがとう。たぶん、笑顔がいちばんの始まりだね。"},
  {y:"*You're* *right*. *Take* *care*!",jp:"その通りですね。お気をつけて。"}],
  words:[["layover","/ˈleɪoʊvər/","乗り継ぎの待ち時間"],["voucher","/ˈvaʊtʃər/","クーポン"],["rude","/ruːd/","失礼な"],["cashier","/kæˈʃɪr/","レジ係"],["polite","/pəˈlaɪt/","礼儀正しい"],["in the end","/ɪn ði ɛnd/","結局"]]},
 ahlan_good:{who:'Ahlan Lounge',lines:[
  {n:"This lounge is great! I got a recliner with a footrest by the glass wall.",jp:"このラウンジ最高！ガラスの壁の横で、足置きつきのリクライニング席に座れたよ。"},
  {y:"*Was* the *food* *good*?",jp:"料理はどうでしたか。"},
  {n:"Very good, and always fresh. The bathrooms were spotless too. Checking in with my lounge pass was quick.",jp:"とてもおいしくて、いつも新しいの。トイレもピカピカ。ラウンジのパスでの受付も早かったよ。"},
  {y:"*Wow*. *Can* I *sleep* *there*?",jp:"わあ。そこで眠れますか。"},
  {n:"Yes, the recliners are comfortable. I slept for two hours.",jp:"うん、リクライニング席は快適。2時間寝たよ。"},
  {y:"*Two* *hours*! *Did* you *miss* your *flight*?",jp:"2時間も！フライトに乗り遅れませんでしたか。"},
  {n:"No! I set an alarm. And a screen shows the gate time.",jp:"ううん！アラームをかけたの。それに画面でゲートの時間も分かるし。"},
  {y:"*Smart*. *What* *about* *drinks*?",jp:"賢いですね。飲み物はどうですか。"},
  {n:"Tea, juice, coffee. All free. Go and enjoy!",jp:"紅茶、ジュース、コーヒー。全部無料。行って楽しんで！"},
  {y:"*Thank* you. *I'll* *go* *now*.",jp:"ありがとう。いま行きます。"}],
  words:[["lounge","/laʊndʒ/","ラウンジ"],["recliner","/rɪˈklaɪnər/","リクライニング席"],["footrest","/ˈfʊtrɛst/","足置き"],["spotless","/ˈspɑːtləs/","ピカピカの"],["alarm","/əˈlɑːrm/","アラーム"],["free","/friː/","無料の"]]},
 ahlan_bad:{who:'Ahlan Lounge',lines:[
  {n:"The shower was a problem. I had to make a reservation at the front desk, and the shower area was a ten-minute walk away.",jp:"シャワーが問題でね。受付で予約が必要で、シャワー室は歩いて10分も離れていたんだ。"},
  {y:"*Ten* *minutes*? Was the *water* *hot*?",jp:"10分も？お湯は熱かったですか。"},
  {n:"No. It was a little cool.",jp:"いや。ちょっとぬるかったよ。"},
  {y:"*That's* *too* *bad*. *Was* it *clean*?",jp:"それは残念。きれいでしたか。"},
  {n:"Yes, it was clean. But I waited thirty minutes for my turn.",jp:"うん、きれいだった。でも順番を30分待ったんだ。"},
  {y:"*Thirty* *minutes*! *Did* you *have* *time*?",jp:"30分も！時間は足りましたか。"},
  {n:"Just enough. I ran to my gate after that.",jp:"ぎりぎり。そのあとゲートまで走ったよ。"},
  {y:"*Oh* *no*. *Were* you *late*?",jp:"それは大変。遅れましたか。"},
  {n:"A little, but I made it. Reserve early next time!",jp:"少しね、でも間に合った。次は早めに予約してね！"},
  {y:"*Good* *advice*. *Thank* you!",jp:"いい助言です。ありがとう。"}],
  words:[["reservation","/ˌrɛzərˈveɪʃən/","予約"],["front desk","/frʌnt dɛsk/","受付"],["shower","/ˈʃaʊər/","シャワー"],["turn","/tɜːrn/","順番"],["make it","/meɪk ɪt/","間に合う"],["advice","/ədˈvaɪs/","助言"]]},
 t3_good:{who:'ターミナル3の旅行者',lines:[
  {n:"This terminal is huge, but it's clean and well organized. The signs are clear!",jp:"このターミナルは巨大だけど、清潔でよく整理されているの。案内表示も分かりやすい。"},
  {y:"*Great*! I was *nervous*.",jp:"よかった。緊張していたんです。"},
  {n:"Don't worry. There are lots of chairs, and the staff are helpful.",jp:"大丈夫。椅子もたくさんあるし、スタッフも親切よ。"},
  {y:"*Where* is the *best* *place* to *wait*?",jp:"待つのにいちばんいい場所はどこですか。"},
  {n:"Near the big windows. You can watch the planes.",jp:"大きな窓の近く。飛行機が見られるわよ。"},
  {y:"*That* *sounds* *fun*. *Is* it *far*?",jp:"楽しそうですね。遠いですか。"},
  {n:"Ten minutes on foot. Follow the red and blue pillars.",jp:"歩いて10分。赤と青の柱をたどって。"},
  {y:"*Red* and *blue*? *I* *see* *them*!",jp:"赤と青？見えました。"},
  {n:"Yes! Those are easy to find. Enjoy Dubai!",jp:"そう！見つけやすいでしょ。ドバイを楽しんでね。"},
  {y:"*Thank* you. *I'll* *walk* *there*.",jp:"ありがとう。そこまで歩きます。"}],
  words:[["organized","/ˈɔːrɡənaɪzd/","整理された"],["signs","/saɪnz/","案内表示"],["helpful","/ˈhɛlpfəl/","親切な"],["nervous","/ˈnɜːrvəs/","緊張した"],["pillar","/ˈpɪlər/","柱"],["on foot","/ɑːn fʊt/","徒歩で"]]},
 t3_queue:{who:'ターミナル3の旅行者',lines:[
  {n:"Earlier, at check-in, only three of the twenty counters were open. People waited in line for hours.",jp:"さっきのチェックインで、20あるカウンターのうち3つしか開いてなかった。みんな何時間も並んでたよ。"},
  {y:"*Hours*? That's *crazy*!",jp:"何時間も？ひどい。"},
  {n:"I know. The airport is wonderful, but that day the service was bad.",jp:"そうなんだ。空港は素晴らしいのに、その日はサービスが最悪だった。"},
  {y:"*Did* you *miss* your *flight*?",jp:"フライトに乗り遅れましたか。"},
  {n:"No, but I almost did. I ran to the gate.",jp:"いや、でももう少しだった。ゲートまで走ったよ。"},
  {y:"*Oh* *no*. *Was* it *far*?",jp:"それは大変。遠かったですか。"},
  {n:"Very far. My legs hurt for a day.",jp:"すごく遠い。足が1日じゅう痛かった。"},
  {y:"*I'll* *go* *early*. *Thanks* for the *warning*.",jp:"早めに行きます。教えてくれてありがとう。"},
  {n:"Good idea. Arrive three hours before. Good luck!",jp:"いい考え。3時間前に着くといいよ。がんばって！"},
  {y:"*Thank* you. *Have* a *safe* *trip*!",jp:"ありがとう。気をつけて旅してください。"}],
  words:[["counter","/ˈkaʊntər/","カウンター"],["line","/laɪn/","列"],["crazy","/ˈkreɪzi/","ひどい"],["almost","/ˈɔːlmoʊst/","もう少しで"],["hurt","/hɜːrt/","痛む"],["warning","/ˈwɔːrnɪŋ/","警告"]]},
 t3_bus:{who:'ターミナル3の旅行者',lines:[
  {n:"From my gate, I had to take a bus to the plane. It was packed and slow.",jp:"ゲートから飛行機まではバスだったの。ぎゅうぎゅうで、のろのろだった。"},
  {y:"*Packed*? I *hope* I *get* a *seat*.",jp:"ぎゅうぎゅう？座れるといいな。"},
  {n:"Probably not. I stood for fifteen minutes.",jp:"たぶん無理ね。私は15分立っていたわ。"},
  {y:"*Fifteen* *minutes*? *That's* *long*.",jp:"15分も？長いですね。"},
  {n:"Yes, and my bag was heavy too. Keep your bag small.",jp:"そう、しかも荷物も重かった。荷物は小さくしておいてね。"},
  {y:"*Good* *tip*. *I* *have* a *small* *bag*.",jp:"いい助言ですね。小さいバッグです。"},
  {n:"Then you'll be fine. Hold the pole tightly.",jp:"それなら大丈夫。ポールをしっかりつかんで。"},
  {y:"*Okay*. *I'll* *hold* it *tight*.",jp:"わかりました。しっかりつかみます。"},

var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];

var CT={"i'm":['i','am'],"it's":['it','is'],"that's":['that','is'],"what's":['what','is'],"there's":['there','is'],"he's":['he','is'],"she's":['she','is'],"here's":['here','is'],"where's":['where','is'],"who's":['who','is'],"how's":['how','is'],"let's":['let','us'],"you're":['you','are'],"we're":['we','are'],"they're":['they','are'],"i've":['i','have'],"you've":['you','have'],"we've":['we','have'],"they've":['they','have'],"i'll":['i','will'],"you'll":['you','will'],"we'll":['we','will'],"they'll":['they','will'],"he'll":['he','will'],"she'll":['she','will'],"it'll":['it','will'],"can't":['can','not'],"cannot":['can','not'],"won't":['will','not'],"don't":['do','not'],"doesn't":['does','not'],"didn't":['did','not'],"isn't":['is','not'],"aren't":['are','not'],"wasn't":['was','not'],"weren't":['were','not'],"couldn't":['could','not'],"wouldn't":['would','not'],"shouldn't":['should','not'],"haven't":['have','not'],"hasn't":['has','not'],"hadn't":['had','not']};
(function(){var amb={its:1,hes:1,shes:1,ill:1,well:1,were:1,lets:1,hell:1,shell:1,whos:1};Object.keys(CT).forEach(function(k){var s=k.replace(/'/g,'');if(s!==k&&!amb[s]&&!CT[s])CT[s]=CT[k]})})();
function expandTok(raw){
 var s=String(raw).toLowerCase().replace(/[’‘`]/g,"'"),out=[];
 s.split(/[-‐-―]+/).forEach(function(p){
  p=p.replace(/[^a-z0-9']/g,'');if(!p)return;
  if(/^[0-9]+$/.test(p)){var nw=numWords(parseInt(p,10));if(nw){out=out.concat(nw);return}out.push(p);return}

function alignWords(tg,hd){

 for(i=0;i<n;i++)rt.push({ok:false,hj:-1});for(j=0;j<m;j++)rh.push('bad');
 function flush(){var k=Math.min(gt.length,gh.length),q;for(q=0;q<k;q++)rt[gt[q]].hj=gh[q];gt=[];gh=[]}
 i=0;j=0;
 while(i<n&&j<m){
  if(tg[i]===hd[j]){flush();rt[i].ok=true;rt[i].hj=j;rh[j]='ok';i++;j++}
  else if(d[i+1][j]>=d[i][j+1]){gt.push(i);i++}
  else{gh.push(j);j++}}

function kindOf(t,h){

/* tgToks: 画面に出ている単語(句読点つき) / heardText: 聞こえた文字 → 単語ごとの結果 */
function analyze(tgToks,heardText){

 /* 目標に it's / we're などがあるときだけ、聞こえた its / were を「it is」「we are」として扱う */
 var tc={};tgToks.forEach(function(t){var key=String(t).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9']/g,'');if(key.indexOf("'")>0&&CT[key])tc[key.replace(/'/g,'')]=CT[key]});

 rawH.forEach(function(t,j){var e=expandTok(t);if(e.length===1&&tc[e[0]])e=tc[e[0]];e.forEach(function(w){hd.push(w);hown.push(j)})});

  var ps=parts[q],w={t:t,ok:true,k:'ok',h:null};

  n++;

  if(allOk){okN++;w.h=ps.map(function(p){return hd[p.hj]}).join(' ');words.push(w);return}
  w.ok=false;
  if(ps.length===1){var p=ps[0],h=p.hj>=0?hd[p.hj]:null,kk=kindOf(p.w,h);w.k=kk.k;w.h=h;if(kk.keep)w.keep=kk.keep}

  words.push(w)});
