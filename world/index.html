<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カンペ先生 せかい</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0d1226;color:#f4f1e8;font-family:'DotGothic16','M PLUS Rounded 1c',sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.screen{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.top{height:56px;flex:none;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl{font-size:20px;color:#ffc72c;letter-spacing:.08em}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:9px;height:9px;border-radius:2px;background:#05070f;border:1px solid #5b6690}
.pips i.on{background:#ffc72c;border-color:#ffc72c}
.mapbox{position:relative;flex:1 1 auto;min-height:300px;max-height:460px;background:#3a9be6;overflow:hidden}
.mapbox svg.map{display:block;width:100%;height:100%}
.land{stroke:#2d7a2c;stroke-width:.55;stroke-linejoin:round;shape-rendering:crispEdges}
.grid{stroke:#fff;stroke-opacity:.16;stroke-width:.25;fill:none}
.shore{filter:drop-shadow(0 0 1px #d8f4ff) drop-shadow(0 0 2px #7ccbfa)}
.nd{cursor:pointer;outline:none}
.nd:focus-visible rect.main{stroke:#fff;stroke-width:1.6}
.nlabel{font-size:3.7px;fill:#f4f1e8;paint-order:stroke;stroke:#0d1226;stroke-width:1.1px;stroke-linejoin:round;text-anchor:middle}
.nglyph{text-anchor:middle;dominant-baseline:central;font-size:7px}
.lower{flex:none;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.card{background:#05070f;border:4px double #f4f1e8;border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dim{color:#9aa6c4}
.small{font-size:12px}
.mid{font-size:13px;line-height:1.7}
.place{font-size:24px}
.big{font:inherit;font-size:20px;color:#fff;background:#ff5a3c;border:3px solid #2a1a10;border-radius:14px;padding:12px;box-shadow:0 5px 0 #2a1a10;min-height:56px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2a1a10}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:14px;border:2px solid #2a1a10;border-radius:3px;vertical-align:-3px}
/* 搭乗ゲート */
.gscene{position:relative;height:236px;flex:none;background:#1a2145;overflow:hidden}
.gwin{position:absolute;left:24px;right:24px;top:44px;height:128px;border:4px solid #5b6690;background:#3b6bb0;overflow:hidden}
.gwin .sand{position:absolute;left:0;right:0;bottom:0;height:34px;background:#f2a65a}
.gwin .road{position:absolute;left:0;right:0;bottom:0;height:14px;background:#6b6f80}
.gwin svg{position:absolute;left:50%;top:22px;width:190px;transform:translateX(-50%);shape-rendering:crispEdges}
.gtag{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#05070f;border:3px solid #ffc72c;border-top:0;border-radius:0 0 8px 8px;padding:5px 18px 6px;font-size:18px;color:#ffc72c;letter-spacing:.12em;white-space:nowrap}
.gfloor{position:absolute;left:0;right:0;bottom:0;height:40px;background:#0a0e22}
.body{flex:1;min-height:0;padding:18px 16px 18px;display:flex;flex-direction:column;gap:16px}
.say{position:relative;background:#05070f;border:3px solid #f4f1e8;border-radius:6px;padding:16px 14px 12px;box-shadow:0 0 0 2px #05070f,0 0 0 4px #5b6690}
.say .who{position:absolute;top:-12px;left:12px;background:#05070f;border:2px solid #f4f1e8;border-radius:4px;padding:0 8px;font-size:12px;letter-spacing:.06em}
.say p{margin:0}
.say .en{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:18px;line-height:1.5}
.say .jp{margin-top:4px;font-size:13px;color:#9aa6c4}
.opts{background:#05070f;border:5px double #f4f1e8;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.opt{background:none;border:0;text-align:left;min-height:56px;padding:8px 6px 8px 30px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.opt .cur{position:absolute;left:6px;font-size:16px;visibility:hidden}
.opt:hover .cur,.opt:focus-visible .cur{visibility:visible}
.opt:focus-visible{outline:2px solid #ffc72c;outline-offset:-2px}
.opt .nm{font-size:24px}
.opt .nm small{font-size:12px;color:#ffc72c}
.opt .dist{font-size:13px;color:#9aa6c4;text-align:right}
.opt.quit{color:#9aa6c4;font-size:20px}
.note{font-size:12px;line-height:1.7;color:#9aa6c4;text-align:center}
.bar{height:12px;background:#1a2142;border:2px solid #5b6690;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ffc72c}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 1 世界マップ -->
<main class="screen" id="sMap">
 <div class="top">
  <div><div class="ttl">せかい</div><div class="pips" id="pips"></div></div>
 </div>
 <div class="mapbox" id="mapBox"></div>
 <div class="lower">
  <div class="card">
   <div class="row">
    <div><div class="small dim">いまの ばしょ</div><div class="place" id="curName"></div></div>
    <div class="mid" style="text-align:right"><div id="cntClear"></div><div id="cntOpen"></div></div>
   </div>
   <div class="mid dim">？を おすと、つぎの 行き先を えらべます。</div>
  </div>
  <button type="button" class="big" id="btnMain"></button>
  <div class="legend small dim">
   <span><span class="sw" style="background:#ffc72c"></span> クリア</span>
   <span><span class="sw" style="background:#ff5a3c"></span> いま いる</span>
   <span><span class="sw" style="background:#fff6d8"></span> いける ？</span>
  </div>
 </div>
</main>

<!-- 2 搭乗ゲート -->
<main class="screen" id="sGate" hidden>
 <div class="gscene">
  <div class="gwin"><div class="sand"></div><div class="road"></div><div id="gatePlane"></div></div>
  <div class="gtag">GATE 7</div>
  <div class="gfloor"></div>
 </div>
 <div class="body">
  <div class="say">
   <span class="who">Gate Agent</span>
   <p class="en">Where would you like to fly next?</p>
   <p class="jp">つぎは どこへ 飛びますか。</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="note" id="gateNote">？は、着くまで 国の名前が 見えません。</div>
 </div>
</main>

<!-- 3 飛行中 -->
<main class="screen" id="sFlight" hidden>
 <div class="top">
  <div class="ttl">ひこうちゅう</div>
  <div class="dim" style="font-size:14px" id="flRoute"></div>
 </div>
 <div class="mapbox" id="flBox"></div>
 <div class="body">
  <div class="say">
   <span class="who">Captain</span>
   <p class="en">Fasten your seat belts. We will land soon.</p>
   <p class="jp">シートベルトを しめて ください。まもなく とうちゃくです。</p>
  </div>
  <div class="bar" role="progressbar" aria-label="飛行の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="flBar"><i id="flFill"></i></div>
  <div class="note">着くと、到着場面から はじまります。</div>
 </div>
</main>

 var svg=se('svg',{'class':'map',viewBox:VB.x+' '+VB.y+' '+VB.w+' '+VB.h,preserveAspectRatio:'xMidYMid meet','aria-hidden':'true'});
 svg.innerHTML='<defs><pattern id="'+uid+'" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#86d957"/><rect x=".4" y=".4" width="1" height="1" fill="#6cc84a"/><rect x="1.9" y="1.9" width="1" height="1" fill="#6cc84a"/></pattern></defs>'+
 '<path class="grid" d="M-180 -60H180M-180 -30H180M-180 0H180M-180 30H180M-180 60H180M-150 -90V90M-120 -90V90M-90 -90V90M-60 -90V90M-30 -90V90M0 -90V90M30 -90V90M60 -90V90M90 -90V90M120 -90V90M150 -90V90"/>'+
 '<g class="shore">'+LAND.replace(/class="land"/g,'class="land" fill="url(#'+uid+')"')+'</g>';
 return svg}
function xy(id){return {x:AP[id].lon,y:-AP[id].lat}}

/* ---------- 状態から見える空港 ---------- */
function visibleSet(s){
 var v={};
 Object.keys(AP).forEach(function(id){
  if(s.cleared[id]||s.seen[id]||s.at===id)v[id]=1;
  else if(NEI[id].some(function(n){return s.cleared[n]}))v[id]=1});
 return v}
function isOpen(s,id){return !s.cleared[id]&&NEI[id].some(function(n){return s.cleared[n]})}

function node(s,id,onTap){
 var p=xy(id),cur=s.at===id,cl=!!s.cleared[id];
 var g=se('g',{'class':'nd',transform:'translate('+p.x+' '+p.y+')',role:'button',tabindex:'0'});
 var known=cl||s.seen[id]||cur;
 g.setAttribute('aria-label',(known?AP[id].n:'？')+(cl?' クリア済み':cur?' いま いる':' いける'));
 var fill=cl?'#ffc72c':(cur?'#ff5a3c':'#fff6d8'),ink=cl?'#2a1a10':(cur?'#fff':'#27325a');
 g.appendChild(se('rect',{x:-6,y:-4.9,width:12,height:12,rx:1.6,fill:'#2a1a10'}));
 g.appendChild(se('rect',{'class':'main',x:-6,y:-6,width:12,height:12,rx:1.6,fill:fill,stroke:'#2a1a10','stroke-width':.9}));
 var t=se('text',{'class':'nglyph',x:0,y:.4,fill:ink});t.textContent=cl?'✓':(cur?'▶':'？');g.appendChild(t);
 if(known){var l=se('text',{'class':'nlabel',x:0,y:10.2});l.textContent=AP[id].n;g.appendChild(l)}
 if(cur){var w=pix(WALK_ROWS,WALK_PAL);w.setAttribute('x',-28);w.setAttribute('y',-5.4);w.setAttribute('width',20.7);w.setAttribute('height',10.8);g.appendChild(w)}
 g.addEventListener('click',onTap);
 g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap()}});
 return g}

function drawEdges(svg,pairs,s){
 pairs.forEach(function(p){
  var a=xy(p[0]),b=xy(p[1]),solid=s.cleared[p[0]]&&s.cleared[p[1]];
  svg.appendChild(se('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:solid?'#ffc72c':'#f4f1e8','stroke-width':solid?1.1:.9,'stroke-dasharray':solid?'none':'2 1.6',opacity:solid?1:.85}))})}

var S=load();

function renderMap(){
 S=load();
 var vis=visibleSet(S),box=$('mapBox');box.textContent='';
 var svg=baseMap(),pairs=[],seen={};
 Object.keys(vis).forEach(function(a){NEI[a].forEach(function(b){
  if(!vis[b])return;if(!(S.cleared[a]||S.cleared[b]))return;
  var k=[a,b].sort().join('-');if(seen[k])return;seen[k]=1;pairs.push([a,b])})});
 drawEdges(svg,pairs,S);
 Object.keys(vis).forEach(function(id){svg.appendChild(node(S,id,openGate))});
 box.appendChild(svg);
 var nC=Object.keys(S.cleared).length,nO=Object.keys(vis).filter(function(id){return isOpen(S,id)}).length;
 $('curName').textContent='';
 var cn=document.createElement('span');cn.textContent=AP[S.at].n;$('curName').appendChild(cn);
 var en=document.createElement('span');en.className='small dim';en.textContent=' '+AP[S.at].en;$('curName').appendChild(en);
 $('cntClear').textContent='クリア　'+nC+' / '+TOTAL;
 $('cntOpen').textContent='いける　？ '+nO+'か所';
 var pips=$('pips');pips.textContent='';
 for(var i=0;i<TOTAL;i++){var d=document.createElement('i');if(i<nC)d.className='on';pips.appendChild(d)}
 var b=$('btnMain');
 b.textContent=AP[S.at].url?'くうこうに もどる':'とうじょうゲートへ';
}

/* ---------- 画面の切りかえ ---------- */
function show(id){['sMap','sGate','sFlight'].forEach(function(k){$(k).hidden=(k!==id)});window.scrollTo(0,0)}

/* ---------- 搭乗ゲート ---------- */
function openGate(){
 S=load();
 var box=$('opts');box.textContent='';var anyQ=false;
 var dests=NEI[S.at].filter(function(id){return S.cleared[id]||isOpen(S,id)});
 dests.forEach(function(id){
  var g=geo(AP[S.at],AP[id]),cl=!!S.cleared[id],known=cl||S.seen[id];if(!known)anyQ=true;
  var b=document.createElement('button');b.type='button';b.className='opt';
  var cur=document.createElement('span');cur.className='cur';cur.textContent='▶';b.appendChild(cur);
  var nm=document.createElement('span');nm.className='nm';nm.textContent=known?AP[id].n:'？';
  if(cl){var sm=document.createElement('small');sm.textContent=' クリア済み';nm.appendChild(sm)}
  b.appendChild(nm);
  var ds=document.createElement('span');ds.className='dist';ds.textContent=g.dir+'へ　約'+g.km.toLocaleString('ja-JP')+' km';b.appendChild(ds);
  b.addEventListener('click',function(){fly(id)});
  box.appendChild(b)});
 var q=document.createElement('button');q.type='button';q.className='opt quit';q.textContent='やめる';
 q.addEventListener('click',function(){renderMap();show('sMap')});box.appendChild(q);
 $('gateNote').style.display=anyQ?'':'none';
 var gp=$('gatePlane');gp.textContent='';gp.appendChild(pix(PLANE_ROWS,PLANE_PAL));
 show('sGate');
 var first=box.querySelector('button');if(first)first.focus({preventScroll:true})}

/* ---------- 飛行中 ---------- */
var flyTimer=0;
function fly(to){
 S=load();
 var from=S.at,knownTo=S.cleared[to]||S.seen[to];
 $('flRoute').textContent=AP[from].n+' → '+(knownTo?AP[to].n:'？');
 S.at=to;S.seen[to]=1;store(S);
 var box=$('flBox');box.textContent='';
 var svg=baseMap(),a=xy(from),b=xy(to);
 svg.appendChild(se('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#f4f1e8','stroke-width':.9,'stroke-dasharray':'2 1.6',opacity:.85}));
 [[from,true],[to,false]].forEach(function(o){
  var id=o[0],p=xy(id),cl=!!S.cleared[id];
  var g=se('g',{transform:'translate('+p.x+' '+p.y+')','aria-hidden':'true'});
  g.appendChild(se('rect',{x:-6,y:-4.9,width:12,height:12,rx:1.6,fill:'#2a1a10'}));
  g.appendChild(se('rect',{x:-6,y:-6,width:12,height:12,rx:1.6,fill:cl?'#ffc72c':'#fff6d8',stroke:'#2a1a10','stroke-width':.9}));
  var t=se('text',{'class':'nglyph',x:0,y:.4,fill:cl?'#2a1a10':'#27325a'});t.textContent=cl?'✓':'？';g.appendChild(t);
  if(cl||S.seen[id]&&id===from){var l=se('text',{'class':'nlabel',x:0,y:10.2});l.textContent=AP[id].n;g.appendChild(l)}
  svg.appendChild(g)});
 var pl=pix(PLANE_ROWS,PLANE_PAL),PW=34,PH=PW*PLANE_ROWS.length/PLANE_ROWS[0].length;
 pl.setAttribute('width',PW);pl.setAttribute('height',PH);
 var flip=b.x>a.x;
 var wrap=se('g',{});var inner=se('g',{});inner.appendChild(pl);wrap.appendChild(inner);svg.appendChild(wrap);
 box.appendChild(svg);
 show('sFlight');
 var T=5500,t0=performance.now(),bar=$('flBar'),fill=$('flFill');
 cancelAnimationFrame(flyTimer);
 function step(now){
  var p=Math.min(1,(now-t0)/T),cx=a.x+(b.x-a.x)*p,cy=a.y+(b.y-a.y)*p-4+Math.sin(now/260)*.8;
  wrap.setAttribute('transform','translate('+(cx-PW/2)+' '+(cy-PH/2)+')');
  inner.setAttribute('transform',flip?'translate('+PW+' 0) scale(-1 1)':'');
  fill.style.width=(p*100)+'%';bar.setAttribute('aria-valuenow',Math.round(p*100));
  if(p<1){flyTimer=requestAnimationFrame(step);return}
  if(AP[to].url){location.href=AP[to].url}else{renderMap();show('sMap')}}
 flyTimer=requestAnimationFrame(step)}

$('btnMain').addEventListener('click',function(){
 S=load();
 if(AP[S.at].url)location.href=AP[S.at].url;else openGate()});
window.addEventListener('pageshow',function(){cancelAnimationFrame(flyTimer);renderMap();show('sMap')});
renderMap();show('sMap');
})();
</script>
</body>
</html>
